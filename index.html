<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Binary Ninja — swing through an obfuscated binary</title>
    <meta
      name="description"
      content="A browser grappling platformer built from real Hikari-obfuscated x86-64 programs: swing between floating blocks of actual disassembly, and don't trust the fake ones."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#04060a" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Binary Ninja</h1>
      <nav aria-label="Primary">
        <a href="./" aria-current="page">Play</a>
        <a href="./about.html">About the data</a>
      </nav>
      <p class="topbar-note">Hikari-obfuscated x86-64 · five real traces</p>
    </header>

    <main id="app">
      <canvas
        id="stage"
        tabindex="0"
        aria-label="Binary Ninja game view. Use A and D to move, space to jump, and hold the left mouse button to fire the grappling line."
      ></canvas>
      <noscript>
        <p class="noscript">
          Binary Ninja is a real-time game and needs JavaScript. The level data it reads is at
          <code>web_game_data/index.json</code>.
        </p>
      </noscript>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
